<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Storefront | FastAPI Demo</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <div class="logo">⚡ NextGen Store</div>
    <nav id="auth-nav">
      <!-- Dynamically populated by app.js -->
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Production-Ready E-Commerce Store</h1>
      <p>Powered by FastAPI 0.111+, SQLAlchemy 2.0, PostgreSQL & Pydantic v2</p>
    </section>

    <div class="controls">
      <input type="text" class="search-input" placeholder="🔍 Search products by name or description..." oninput="handleSearch(this.value)">
    </div>

    <div id="category-pills" class="category-pills">
      <!-- Category filters dynamically loaded -->
    </div>

    <div id="products-grid" class="products-grid">
      <!-- Products loaded via JavaScript -->
    </div>
  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-backdrop">
    <div class="modal">
      <h2>Welcome Back</h2>
      <form onsubmit="executeLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="username" required placeholder="customer@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required placeholder="••••••••">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
          <button type="button" class="nav-btn" onclick="closeModal('login-modal')">Cancel</button>
          <button type="submit" class="btn-primary">Log In</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="register-modal" class="modal-backdrop">
    <div class="modal">
      <h2>Create Account</h2>
      <form onsubmit="executeRegister(event)">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" required placeholder="John">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" required placeholder="Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" required minlength="8" placeholder="••••••••">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
          <button type="button" class="nav-btn" onclick="closeModal('register-modal')">Cancel</button>
          <button type="submit" class="btn-primary">Register</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Cart Modal -->
  <div id="cart-modal" class="modal-backdrop">
    <div class="modal">
      <h2>Shopping Cart</h2>
      <div id="cart-items">
        <!-- Cart items dynamically rendered -->
      </div>
      <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
        <button class="nav-btn" onclick="closeModal('cart-modal')">Close</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/static/app.js"></script>
</body>
</html>
